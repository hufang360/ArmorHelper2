[project]
name = "armorhelper-web"
version = "2.1.0"
description = "Static web app that turns a 128x80 Terraria armor template into 1.4.4+ sheets (tools and tests still use Python)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["Pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
