<!doctype html>
<meta charset="utf-8"><title>harness</title>
<iframe id="frame" src="./" style="width:1100px;height:820px"></iframe>
<script type="module">
const report = (payload) =>
  fetch("__done", { method: "POST", body: JSON.stringify(payload) }).catch(() => {});

/**
 * Name the step the harness is in, so a hang says where instead of "the page
 * never reported back". The runner keeps the tail and prints it on timeout.
 */
const step = (name) => {
  fetch("__step", { method: "POST", body: name }).catch(() => {});
};
const frame = document.getElementById("frame");

/** Is the service worker registered, and is its scope the folder we are in? */
async function serviceWorkerInfo(win) {
  if (!("serviceWorker" in win.navigator)) return { supported: false, scope: null, controlled: false };
  // getRegistration() 可能在注册完成前就返回 undefined；ready 会等安装结束。
  const registration =
    (await Promise.race([
      win.navigator.serviceWorker.ready,
      new Promise((resolve) => setTimeout(() => resolve(null), 3000)),
    ])) ?? (await win.navigator.serviceWorker.getRegistration());
  return {
    supported: true,
    scope: registration?.scope ?? null,
    controlled: !!win.navigator.serviceWorker.controller,
  };
}

/** Wait until the card has been redrawn for the current template. */
async function waitRender(doc) {
  let last = "";
  let stable = 0;
  for (let tick = 0; tick < 400; tick += 1) {
    await sleep(25);
    const now = doc.querySelector("#preview-gif")?.dataset.render ?? "";
    if (now && now === last) stable += 1;
    else stable = 0;
    last = now;
    if (stable >= 3) return;
  }
}

const appInfo = (doc) => ({
  uploadPrimaryAtStart: doc.querySelector("#upload-file").classList.contains("btn-primary"),
  status: doc.querySelector("#status").textContent.trim(),
  sets: doc.querySelectorAll("#set-select option").length,
  checkboxes: doc.querySelectorAll("input[type=checkbox]").length,
  checkboxIds: [...doc.querySelectorAll("input[type=checkbox]")].map((el) => el.id),

  guide: !!doc.querySelector("#rev-guide")?.checked,

  guideLabel: (doc.querySelector('[data-i18n="web.guideOverlay"]') || {}).textContent || "",
  favicon: doc.querySelector('link[rel="icon"]')?.getAttribute("href") || null,

/**
 * The drop area's own tools: the demo button loads the bundled template, the
 * guide icon overlays the preview, and the download icon hands out what is
 * shown — merged when the guide is on, the untouched file when it is off.
 */
async function runDropTools(doc) {
  const preview = doc.querySelector("#template-preview");
  const guideButton = doc.querySelector("#drop-guide");
  const downloadButton = doc.querySelector("#drop-download");
  const box = doc.querySelector(".preview-box");
  const shown = (el) => !!el && getComputedStyle(el).display !== "none";
  const waitPreview = async (test) => {
    for (let tick = 0; tick < 200; tick += 1) {
      await sleep(25);
      if (test(preview.getAttribute("src") ?? "")) return;
    }
  };

  // nothing is loaded yet: no box beside the drop area, no empty line below it
  // the buttons fade in, so their opacity only means something once it settles
  await sleep(300);
  const beforeLoad = {
    boxShown: shown(box),
    resultText: doc.querySelector("#results").textContent.trim(),
    tools: [...doc.querySelectorAll(".drop-tools .icon-btn")].map((button) => button.id),
  };

  doc.querySelector("#load-demo").click();
  for (let tick = 0; tick < 200 && preview.hidden; tick += 1) await sleep(25);
  for (let tick = 0; tick < 200 && !shown(box); tick += 1) await sleep(25);
  // the buttons are only enabled with a template in, and they fade in
  await sleep(300);
  const select = doc.querySelector("#export-gif-speed");
  const report = {
    loaded: !doc.querySelector("#template-preview").hidden,
    beforeLoad,
    boxShownAfterLoad: shown(box),
    toolOpacity: [...doc.querySelectorAll(".drop-tools .icon-btn")].map((button) =>
      Number(getComputedStyle(button).opacity),
    ),
    // the two selects are one size below .form-select-sm (14px)
    selectStyle: {
      height: Math.round(select.getBoundingClientRect().height),
      font: parseFloat(getComputedStyle(select).fontSize),
    },
    titles: [guideButton, downloadButton, doc.querySelector("#load-demo")].map((el) => el.getAttribute("title")),
    // the demo template already carries the guide lines
    guideDisabledOnDemo: guideButton.disabled,
    tooltips: [guideButton, downloadButton, doc.querySelector("#drop-clear"), doc.querySelector("#load-demo")].map(
      (el) => el.dataset.tooltip ?? null,
    ),
  };

  // The bundled template already carries the guide lines, so the overlay makes
  // no difference on it. Use a flat template, where the effect is visible.
  const { createBitmap } = await import("./js/bitmap.js");
  const flat = createBitmap(128, 80);
  for (let offset = 0; offset < flat.data.length; offset += 4) {
    flat.data[offset] = 40;
    flat.data[offset + 1] = 40;
    flat.data[offset + 2] = 40;
    flat.data[offset + 3] = 255;
  }
  await putFiles(doc, "#file-input", [["Flat.png", flat]]);
  await waitPreview((src) => src !== "");
  await sleep(200);
  report.guideEnabledOnFlat = !guideButton.disabled;

  const decode = async (capture) => {
    const { decodeBitmap } = await import("./js/fs.js");
    const bytes = Uint8Array.from(atob(capture.base64), (char) => char.charCodeAt(0));
    return decodeBitmap(new Blob([bytes], { type: "image/png" }));
  };

  // the guide starts on: that download is the merged image
  const merged = await captureDownload(frame.contentWindow, downloadButton);
  const mergedSrc = preview.getAttribute("src");
  guideButton.click();
  await waitPreview((src) => src !== mergedSrc);
  const plain = await captureDownload(frame.contentWindow, downloadButton);
  const plainSrc = preview.getAttribute("src");
  const pressed = [guideButton.getAttribute("aria-pressed")];

  guideButton.click();
  await waitPreview((src) => src === mergedSrc);
  pressed.unshift(guideButton.getAttribute("aria-pressed"));

  const mergedBitmap = await decode(merged);
  const plainBitmap = await decode(plain);

  // the same on the real drawing template: the overlay must add its pixels
  const opaque = (bitmap) => {
    let count = 0;
    for (let index = 3; index < bitmap.data.length; index += 4) if (bitmap.data[index] > 1) count += 1;
    return count;
  };
  const { decodeBitmap } = await import("./js/fs.js");
  const artBlob = await (await fetch("./data/ArmorTemplate_v1.png")).blob();
  const artBitmap = await decodeBitmap(artBlob);
  await putFiles(doc, "#file-input", [["Art.png", artBitmap]]);
  await waitPreview((src) => src !== plainSrc);
  await sleep(200);
  const artMerged = opaque(await decode(await captureDownload(frame.contentWindow, downloadButton)));
  guideButton.click();
  await waitPreview((src) => src !== mergedSrc);
  const artPlain = opaque(await decode(await captureDownload(frame.contentWindow, downloadButton)));
  guideButton.click();
  await waitPreview((src) => src !== plainSrc);
  // the overlay changes colours, not alpha, so count differing pixels
  let changed = 0;
  for (let index = 0; index < plainBitmap.data.length; index += 4) {
    for (let channel = 0; channel < 3; channel += 1) {
      if (mergedBitmap.data[index + channel] !== plainBitmap.data[index + channel]) {
        changed += 1;
        break;
      }
    }
  }

  doc.querySelector("#drop-clear").click();
  for (let tick = 0; tick < 200 && !preview.hidden; tick += 1) await sleep(25);
  for (let tick = 0; tick < 200 && shown(box); tick += 1) await sleep(25);
  await sleep(150);

  return {
    ...report,
    pressed,
    guideRedraws: mergedSrc !== plainSrc,
    changed,
    plainMatchesFlat: equalBytes(plainBitmap.data, flat.data),
    artOpaque: [artPlain, artMerged],
    // clearing the drop area hides the box again and leaves no empty line
    afterClear: {
      boxShown: shown(box),
      resultText: doc.querySelector("#results").textContent.trim(),
    },
  };
}

/** Type the three ids, which rebuilds on its own, and wait for the card. */
async function runReverse(doc) {
  doc.querySelector("#rev-head").value = "189";
  doc.querySelector("#rev-body").value = "190";
  doc.querySelector("#rev-legs").value = "130";
  doc.querySelector("#rev-legs").dispatchEvent(new Event("change", { bubbles: true }));

  for (let tick = 0; tick < 400; tick += 1) {
    await new Promise((resolve) => setTimeout(resolve, 25));
    const images = doc.querySelectorAll("#reverse-result .preview img");
    if (images.length) {
      const report = {
        previews: images.length,
        captions: [...doc.querySelectorAll("#reverse-result figcaption")].map((el) => el.textContent),
        widths: [...images].map((img) => img.naturalWidth),
        heights: [...images].map((img) => img.naturalHeight),
        sections: doc.querySelectorAll("#reverse-result .previews").length,
        // the animation is a player above the result now; its PNG link is
        // encoded right after the frames, so wait for it before reading
        player: await (async () => {
          for (let wait = 0; wait < 400; wait += 1) {
            if (!doc.querySelector("#rev-preview-file").hidden) break;
            await new Promise((resolve) => setTimeout(resolve, 25));
          }
          return {
          hidden: doc.querySelector("#rev-preview-box").hidden,
          canvas: [doc.querySelector("#rev-preview-gif").width, doc.querySelector("#rev-preview-gif").height],
          count: doc.querySelector("#rev-gif-count").textContent,
          render: doc.querySelector("#rev-preview-gif").dataset.render ?? "",
          link: doc.querySelector("#rev-preview-file").textContent,
          href: (doc.querySelector("#rev-preview-file").getAttribute("href") || "").slice(0, 5),
          tooltip: doc.querySelector("#rev-preview-info").dataset.tooltip,
          size: doc.querySelector("#rev-gif-size").value,
          };
        })(),
        files: [...doc.querySelectorAll("#reverse-result .files a")].map((a) => a.textContent),
        fileMeta: [...doc.querySelectorAll("#reverse-result .files .text-body-secondary")].map((el) => el.textContent),
        actions: [...doc.querySelectorAll("#reverse-result .actions > *")].map((el) => el.textContent),
        warnings: [...doc.querySelectorAll("#reverse-result .warn")].map((el) => el.textContent),
        status: doc.querySelector("#status").textContent.trim(),
      };

      // The reverse page has its own guide switch: flipping it redraws the
      // template preview without reversing anything again.
      // the drawing template is the one the guide switch redraws
      const before = images[images.length - 1].src;
      const guide = doc.querySelector("#rev-guide");
      guide.checked = false;
      guide.dispatchEvent(new Event("change", { bubbles: true }));
      let after = before;
      for (let tick = 0; tick < 400; tick += 1) {
        await new Promise((resolve) => setTimeout(resolve, 25));
        const now = doc.querySelector("#reverse-result .preview img")?.src ?? "";
        if (now && now !== before) {
          after = now;
          break;
        }
      }
      guide.checked = true;
      guide.dispatchEvent(new Event("change", { bubbles: true }));
      return { ...report, guideChanged: Boolean(before) && after !== before };
    }
    const warnings = doc.querySelectorAll("#reverse-result .warn");
    if (warnings.length && doc.querySelector("#status").className !== "busy") {
      return { error: [...warnings].map((el) => el.textContent).join(" | ") };
    }
  }
  return { error: "reverse produced no preview" };
}

/**
 * Pick a set in the list: selecting it has to refill the ids and rebuild on its
 * own. The second half clicks the option that is already selected, which fires
 * `click` but no `change`, and must rebuild too.
 */
async function runReversePick(doc) {
  const search = doc.querySelector("#set-search");
  const select = doc.querySelector("#set-select");
  const fields = ["#rev-head", "#rev-body", "#rev-legs"];
  const status = () => doc.querySelector("#status").textContent.trim();
  const preview = () => doc.querySelector("#reverse-result .preview img");
  const waitForPreview = async (ready) => {
    for (let tick = 0; tick < 400; tick += 1) {
      await new Promise((resolve) => setTimeout(resolve, 25));
      if (preview() && ready()) {
        return {
          body: doc.querySelector("#rev-body").value,
          files: [...doc.querySelectorAll("#reverse-result .files a")].map((a) => a.textContent),
          status: status(),
        };
      }
    }
    return { error: "no preview after picking a set", status: status() };
  };

  for (const field of fields) doc.querySelector(field).value = "";
  search.value = "星尘";
  search.dispatchEvent(new Event("input", { bubbles: true }));
  for (let tick = 0; tick < 200 && select.options.length !== 1; tick += 1) {
    await new Promise((resolve) => setTimeout(resolve, 25));
  }
  const listed = select.options.length === 1 ? select.options[0].textContent : "";

  select.value = "0";
  select.dispatchEvent(new Event("change", { bubbles: true }));
  const selected = await waitForPreview(() => status().includes("已还原"));

  // the option is selected now: clear the fields and click it again. The image
  // is the same pixels, so the status line is what proves a second run.
  for (const field of fields) doc.querySelector(field).value = "";
  await new Promise((resolve) => setTimeout(resolve, 500));
  doc.querySelector("#status").textContent = "waiting";
  select.dispatchEvent(new Event("click", { bubbles: true }));
  const clicked = await waitForPreview(() => status().includes("已还原"));

  // an id edit rebuilds on demand, even when the set is already on screen
  doc.querySelector("#status").textContent = "waiting";
  const legs = doc.querySelector("#rev-legs");
  legs.value = String(Number(legs.value) + 0);
  legs.dispatchEvent(new Event("change", { bubbles: true }));
  const button = await waitForPreview(() => status().includes("已还原"));

  search.value = "";
  search.dispatchEvent(new Event("input", { bubbles: true }));
  for (let tick = 0; tick < 200 && select.options.length < 100; tick += 1) {
    await new Promise((resolve) => setTimeout(resolve, 25));
  }
  return { listed, selected, clicked, button };
}

/**
 * A set whose typed legs id has no sheet: the set table's own legs id (the
 * skirt, extension or other sex) has to be used instead of leaving the region
 * empty. 长袍 Robe owns only the skirt sheet 88.
 */
async function runReverseFallback(doc) {
  doc.querySelector("#rev-head").value = "";
  doc.querySelector("#rev-body").value = "15";
  doc.querySelector("#rev-legs").value = "999";
  doc.querySelector("#rev-legs").dispatchEvent(new Event("change", { bubbles: true }));

  for (let tick = 0; tick < 400; tick += 1) {
    await new Promise((resolve) => setTimeout(resolve, 25));
    const images = doc.querySelectorAll("#reverse-result .preview img");
    if (images.length) {
      return {
        files: [...doc.querySelectorAll("#reverse-result .files a")].map((a) => a.textContent),
        fileMeta: [...doc.querySelectorAll("#reverse-result .files .text-body-secondary")].map((el) => el.textContent),
        actions: [...doc.querySelectorAll("#reverse-result .actions > *")].map((el) => el.textContent),
        warnings: [...doc.querySelectorAll("#reverse-result .warn")].map((el) => el.textContent),
        status: doc.querySelector("#status").textContent.trim(),
      };
    }
  }
  return { error: "no preview for the fallback set" };
}

/** Build the three generated sheets (and the template) once per call. */
async function makeSheets() {
  const [{ loadLayout }, { decodeBitmap }, { generateHead, generateLegs, generateBodyComposite }] =
    await Promise.all([
      import("./js/data.js"),
      import("./js/fs.js"),
      import("./js/generate.js"),
    ]);
  await loadLayout("./data/layout.json");
  const template = await decodeBitmap(await (await fetch("./data/ArmorTemplate_v1.png")).blob());
  return {
    template,
    head: ["Armor_Head_189.png", generateHead(template)],
    body: ["Armor_190.png", generateBodyComposite(template)],
    legs: ["Armor_Legs_130.png", generateLegs(template)],
  };
}

/** Put a list of `[name, bitmap]` into one file input, like a real pick would. */
async function putFiles(doc, selector, pairs) {
  const { pngBlob } = await import("./js/png.js");
  const transfer = new DataTransfer();
  for (const [name, bitmap] of pairs) {
    transfer.items.add(new File([await pngBlob(bitmap)], name, { type: "image/png" }));
  }
  const input = doc.querySelector(selector);
  input.files = transfer.files;
  input.dispatchEvent(new Event("change", { bubbles: true }));
}

/** Upload three vanilla-named textures through one of the page's inputs. */
async function uploadTextures(doc, selector = "#texture-input") {
  const sheets = await makeSheets();
  await putFiles(doc, selector, [sheets.head, sheets.body, sheets.legs]);
}

const equalBytes = (a, b) => a.length === b.length && a.every((byte, index) => byte === b[index]);
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/**
 * The results card should be as tall as the input card while it is empty
 * (inline min-height), and grow with its own content once a result is shown.
 */
function cardHeights(doc, panelId) {
  const panel = doc.querySelector(panelId);
  // the export page keeps its results outside a card; the other panels do not
  const left = panel.querySelector(".stack > .card, .card");
  const card = panel.querySelector(".results-card") ?? panel.querySelector(".export-results");
  return {
    left: Math.round(left?.getBoundingClientRect().height ?? 0),
    results: Math.round(card?.getBoundingClientRect().height ?? 0),
    forced: card?.style.minHeight ?? "",
  };
}

/**
 * The "preview sheets" tab: three slots, the 20 frame player and the PNG link
 * under it.  Also checks that a sheet dropped into the wrong slot is rejected
 * with a translated message instead of silently used.
 */
async function runSheetGifs(doc) {
  // the box sizes are only measurable while the tab is on screen
  doc.querySelector('[data-tab="gifs"]').click();
  await sleep(60);
  const sheets = await makeSheets();

  /** Wait until the player has drawn the frames of the current sheets. */
  const waitPlayer = async () => {
    const canvas = doc.querySelector("#sheet-preview-gif");
    for (let tick = 0; tick < 400; tick += 1) {
      await sleep(25);
      if (!canvas.hidden && canvas.dataset.render) {
        await sleep(200); // let the PNG link land as well
        return true;
      }
    }
    return false;
  };
  const playerState = () => {
    const canvas = doc.querySelector("#sheet-preview-gif");
    const link = doc.querySelector("#sheet-preview-file");
    const box = doc.querySelector("#sheet-preview-box");
    return {
      boxHeight: Math.round(box.getBoundingClientRect().height),
      boxHidden: box.hidden,
      canvas: [canvas.width, canvas.height],
      count: doc.querySelector("#sheet-gif-count").textContent,
      link: link.textContent,
      download: link.getAttribute("download"),
      href: (link.getAttribute("href") || "").slice(0, 5),
      linkHidden: link.hidden,
      tooltip: doc.querySelector("#sheet-preview-info").dataset.tooltip,
    };
  };

  // the demo button fills all three slots from the bundled vanilla atlas
  const packHidden = doc.querySelector("#do-pack").hidden;
  doc.querySelector("#load-sheets-demo").click();
  for (let tick = 0; tick < 400 && doc.querySelector("#do-pack").disabled; tick += 1) {
    await sleep(25);
  }
  const demo = {
    buttonOrder: [...doc.querySelectorAll("#tab-gifs .actions .btn")].map((el) => el.id),
    packHiddenAtStart: packHidden,
    version: doc.querySelector("#app-version").textContent.trim(),
    slots: [...doc.querySelectorAll(".slot-foot [data-tooltip]")].map(
      (el) => el.dataset.tooltip.split("\n")[0],
    ),
    sizes: [...doc.querySelectorAll(".slot-foot [data-tooltip]")].map(
      (el) => el.dataset.tooltip.split("\n")[1],
    ),
    enabled: !doc.querySelector("#do-pack").disabled,
  };
  for (const role of ["head", "body", "legs"]) {
    doc.querySelector(`#sheet-${role}-clear`).click();
    await sleep(40);
  }
  await sleep(150);

  // wrong slot first: the body grid is not a valid head sheet
  await putFiles(doc, "#sheet-head-input", [sheets.body]);
  await sleep(60);
  const wrongSlotStatus = doc.querySelector("#sheet-status").textContent.trim();
  const wrongSlotFilled = doc
    .querySelector('#sheet-head-slot')
    .closest(".slot")
    .classList.contains("is-filled");

  for (const role of ["head", "body", "legs"]) {
    await putFiles(doc, `#sheet-${role}-input`, [sheets[role]]);
  }
  // no generate button any more: the player draws itself once the three are in
  const drewItself = await waitPlayer();
  const disabled = doc.querySelector("#do-pack").disabled;
  // the main action moves: upload is primary until the three are in
  const uploadAfter = doc.querySelector("#upload-sheets");
  const packButton = doc.querySelector("#do-pack");
  const buttons = {
    uploadPrimary: uploadAfter.classList.contains("btn-primary"),
    uploadSecondary: uploadAfter.classList.contains("btn-secondary"),
    packPrimary: packButton.classList.contains("btn-primary"),
    packSecondary: packButton.classList.contains("btn-secondary"),
    hasClear: !!doc.querySelector("#clear-sheets"),
    hasUploadInput: !!doc.querySelector("#sheet-bulk-input"),
    playerInfo: doc.querySelector("#sheet-player-info")?.dataset.tooltip ?? "",
    hintParagraph: !!doc.querySelector('[data-i18n="web.gifPlayerHint"]'),
  };

  // The bulk upload matches by name first, then by size: names that say
  // nothing still land, and the bigger tall file becomes the legs.
  const { pngBlob } = await import("./js/png.js");
  for (const role of ["head", "body", "legs"]) {
    doc.querySelector(`#sheet-${role}-clear`).click();
    await sleep(40);
  }
  await sleep(120);
  const bulk = new DataTransfer();
  const unnamed = [
    ["1.png", sheets.body[1]],
    ["2.png", sheets.legs[1]],
    ["3.png", sheets.head[1]],
  ];
  for (const [name, bitmap] of unnamed) {
    bulk.items.add(new File([await pngBlob(bitmap)], name, { type: "image/png" }));
  }
  const bulkInput = doc.querySelector("#sheet-bulk-input");
  bulkInput.files = bulk.files;
  bulkInput.dispatchEvent(new Event("change", { bubbles: true }));
  for (let tick = 0; tick < 200; tick += 1) {
    await sleep(25);
    if (!doc.querySelector("#do-pack").disabled) break;
  }
  buttons.bulkNames = [...doc.querySelectorAll(".slot-foot [data-tooltip]")].map(
    (el) => el.dataset.tooltip.split("\n")[0],
  );
  // one tall sheet alone cannot be split: the card asks for a manual drop
  doc.querySelector("#sheet-head-clear").click();
  doc.querySelector("#sheet-legs-clear").click();
  await sleep(80);
  const lonely = new DataTransfer();
  lonely.items.add(new File([await pngBlob(sheets.legs[1])], "4.png", { type: "image/png" }));
  bulkInput.files = lonely.files;
  bulkInput.dispatchEvent(new Event("change", { bubbles: true }));
  await sleep(300);
  buttons.lonelyStatus = doc.querySelector("#sheet-status").textContent.trim();
  // a cleared slot also clears the player
  buttons.playerHiddenWhenEmpty = doc.querySelector("#sheet-preview-box").hidden;

  // put the three real sheets back for the steps that follow
  for (const role of ["head", "body", "legs"]) {
    await putFiles(doc, `#sheet-${role}-input`, [sheets[role]]);
    await sleep(60);
  }
  await waitPlayer();

  // the swap trades the head sheet for the legs sheet
  const nameOf = (role) => doc.querySelector(`#sheet-${role}-info`).dataset.tooltip;
  const headBefore = nameOf("head");
  const legsBefore = nameOf("legs");
  const drawnBefore = doc.querySelector("#sheet-preview-gif").dataset.render;
  doc.querySelector("#sheet-legs-swap").click();
  await sleep(150);
  buttons.swapped = nameOf("head") === legsBefore && nameOf("legs") === headBefore;
  // the player has to be redrawn from the swapped sheets, not kept as it was
  for (let tick = 0; tick < 400; tick += 1) {
    if (doc.querySelector("#sheet-preview-gif").dataset.render !== drawnBefore) break;
    await sleep(25);
  }
  buttons.swappedRedraws = doc.querySelector("#sheet-preview-gif").dataset.render !== drawnBefore;
  doc.querySelector("#sheet-head-swap").click();
  await sleep(150);
  buttons.swappedBack = nameOf("head") === headBefore;
  const sheetStatus = doc.querySelector("#sheet-status").textContent.trim();
  const filled = [...doc.querySelectorAll(".slot")].map((slot) => slot.classList.contains("is-filled"));
  // each slot has to show its own title and a thumbnail of what was dropped
  const titles = [...doc.querySelectorAll(".slot-label")].map((el) => el.textContent.trim());
  const thumbs = [...doc.querySelectorAll(".slot-thumb")].map((img) => ({
    hidden: img.hidden,
    src: (img.getAttribute("src") || "").slice(0, 5),
    width: img.naturalWidth,
  }));
  // the body box is the sheet's own 360x224, head and legs are half as wide
  const boxes = [...doc.querySelectorAll(".slot-drop")].map((el) => {
    const rect = el.getBoundingClientRect();
    return [Math.round(rect.width), Math.round(rect.height)];
  });
  // the remove control is an icon button in the drop area's corner, not a word
  const clearIcons = [...doc.querySelectorAll(".slot-clear")].map((el) => ({
    svg: !!el.querySelector("svg"),
    text: el.textContent.trim(),
    visible: !el.hidden,
  }));
  // head and legs are swappable: their icons sit right below the ×
  const swapIcons = [...doc.querySelectorAll(".slot-swap")].map((el) => ({
    id: el.id,
    visible: !el.hidden,
    tooltip: el.dataset.tooltip ?? "",
  }));
  // the file name and its size are two lines in the info icon's tooltip
  const slotInfo = [...doc.querySelectorAll(".slot-foot [data-tooltip]")].map((el) => ({
    lines: el.dataset.tooltip.split("\n"),
    label: el.closest(".slot-foot").querySelector(".slot-label").textContent.trim(),
    icon: !!el.querySelector("svg"),
    // the name sits under the box, left aligned with it
    corner: (() => {
      const box = el.closest(".slot").querySelector(".slot-drop").getBoundingClientRect();
      const foot = el.closest(".slot-foot").getBoundingClientRect();
      return foot.top >= box.bottom - 1 && Math.abs(foot.left - box.left) < 4;
    })(),
  }));
  if (disabled) return { error: "the pack button stayed disabled", sheetStatus, wrongSlotStatus };

  await sleep(200); // let the layout settle after the slots are filled
  const at2x = playerState();

  // the size select reaches the canvas, and the card keeps its 4x height
  const size = doc.querySelector("#sheet-preview-size");
  size.value = "4";
  size.dispatchEvent(new Event("change", { bubbles: true }));
  for (let tick = 0; tick < 400; tick += 1) {
    await sleep(25);
    if (doc.querySelector("#sheet-preview-gif").width === 160) break;
  }
  const at4x = playerState();
  size.value = "2";
  size.dispatchEvent(new Event("change", { bubbles: true }));
  await sleep(500);

  // the female switch names the female PNG under the player
  doc.querySelector("#sheet-opt-female").click();
  for (let tick = 0; tick < 400; tick += 1) {
    await sleep(25);
    if (doc.querySelector("#sheet-preview-file").textContent.startsWith("FullArmorFemale")) break;
  }
  const femaleLink = doc.querySelector("#sheet-preview-file").textContent;
  doc.querySelector("#sheet-opt-female").click();
  await sleep(400);

  return {
    disabled,
    drewItself,
    demo,
    buttons,
    sheetStatus,
    wrongSlotStatus,
    wrongSlotFilled,
    filled,
    titles,
    thumbs,
    boxes,
    clearIcons,
    swapIcons,
    slotInfo,
    at2x,
    at4x,
    femaleLink,
    // the result block of the old layout is gone
    hasResults: !!doc.querySelector("#gif-results"),
    hasOwnFileTable: doc.querySelectorAll("#tab-gifs .sheet-table").length,
    hasLeftOptions: !!doc.querySelector("#gif-size") || !!doc.querySelector("#gif-player"),
    status: doc.querySelector("#status").textContent.trim(),
    settings: JSON.parse(frame.contentWindow.localStorage.getItem("armorhelper.settings") || "{}"),
  };
}

/**
 * "Overlay player" has to work without any folder: the site ships the three
 * player textures (`data/player/`), which is what makes it usable on a phone.
 */
async function runPlayerOverlay(doc) {
  // the player note is an info icon next to the switch, not a paragraph
  const hintText = doc.querySelector("#sheet-player-info")?.dataset.tooltip ?? "";
  const redraw = (async () => {
    const before = doc.querySelector("#sheet-preview-gif").dataset.render;
    doc.querySelector("#sheet-opt-player").click();
    for (let tick = 0; tick < 400; tick += 1) {
      await sleep(25);
      const canvas = doc.querySelector("#sheet-preview-gif");
      if (canvas.dataset.render !== before && doc.querySelector("#sheet-preview-file").textContent.includes("Player")) {
        return true;
      }
    }
    return false;
  })();

  const redrew = await redraw;
  const report = {
    hintText,
    redrew,
    link: doc.querySelector("#sheet-preview-file").textContent,
    canvas: [doc.querySelector("#sheet-preview-gif").width, doc.querySelector("#sheet-preview-gif").height],
    status: doc.querySelector("#status").textContent.trim(),
  };
  doc.querySelector("#sheet-opt-player").click();

  // each slot's own × empties it, and the player follows with no button press
  for (const role of ["head", "body", "legs"]) {

    await sleep(60);
  }
  for (let wait = 0; wait < 200 && !doc.querySelector("#sheet-preview-box").hidden; wait += 1) {
    await sleep(25);

  report.cleared = doc.querySelector("#sheet-preview-box").hidden;

}

/**
 * Click "make resource pack": the zip goes straight to the browser now, so the
 * test captures what the page hands to the download.
 */
async function runResourcePack(doc) {
  const enabled = !doc.querySelector("#do-pack").disabled;
  const download = await captureDownload(frame.contentWindow, doc.querySelector("#do-pack"));
  if (download.error) return { error: "no resource pack was produced", enabled };
  return {
    enabled,
    signature: download.signature,
    bytes: download.bytes,
    base64: download.base64,
    status: doc.querySelector("#status").textContent.trim(),
  };
}

/**
 * Click the two buttons at the bottom of a result card.
 *
 * This is what caught `save.save is not a function`: the card built its buttons
 * with locals named `zip` / `save`, which shadowed `result.zip` / `result.save`,
 * so nothing was ever downloaded and the console filled with TypeErrors.
 */
async function clickResultButtons(doc, panelId, buttonSelector = null) {
  const win = frame.contentWindow;
  const card = doc.querySelector(`${panelId} .job, ${panelId} .result-block`);
  if (!card) return { error: "no result card" };
  // the export zip button lives in the input card, so callers pass its selector
  const buttons = [...doc.querySelectorAll(buttonSelector ?? `${panelId} .job .actions button`)];
  const labels = buttons.map((button) => button.textContent.trim());
  const disabled = buttons.map((button) => button.disabled);

  const captured = [];
  const realCreate = win.URL.createObjectURL.bind(win.URL);
  win.URL.createObjectURL = (blob) => {
    captured.push(blob);
    return realCreate(blob);
  };
  // the "write to the output folder" button would open a real folder picker,
  // so only press the ones that are enabled — and never wait for a picker
  for (const [index, button] of buttons.entries()) {
    if (disabled[index]) continue;
    button.click();
  }
  for (let tick = 0; tick < 200 && !captured.length; tick += 1) {
    await sleep(25);
  }
  win.URL.createObjectURL = realCreate;

  let signature = null;
  let bytes = 0;
  let base64 = null;
  if (captured.length) {
    const buffer = new Uint8Array(await captured[0].arrayBuffer());
    bytes = buffer.length;
    signature = String.fromCharCode(...buffer.slice(0, 2));
    if (signature === "PK") {
      let binary = "";
      for (const byte of buffer) binary += String.fromCharCode(byte);
      base64 = btoa(binary);
    }
  }
  return {
    labels,
    disabled,
    bytes,
    signature,
    base64,
    status: doc.querySelector("#status").textContent.trim(),
  };
}

/** Titles of the cards in the export result area, top to bottom. */

/** Run a plain export and report what the results card plus history look like. */
async function runExport(doc) {
  const sheets = await makeSheets();
  // there is no export button: the card is drawn as soon as a template lands
  const heightsBefore = cardHeights(doc, "#tab-export");
  await putFiles(doc, "#file-input", [["MyArmor.png", sheets.template]]);
  for (let tick = 0; tick < 400; tick += 1) {
    await sleep(25);
    if (doc.querySelector("#results a[download]")) break;
  }
  await sleep(120);
  const heightsAfter = cardHeights(doc, "#tab-export");
  // the export actions live inside the active tab now
  const buttons = await clickResultButtons(doc, "#tab-export", "#results .pack-actions > button");
  const ui = {
    // the upload button is the main action only while nothing is loaded
    uploadSecondaryAfter: doc.querySelector("#upload-file").classList.contains("btn-secondary"),
    uploadLabel: doc.querySelector("#upload-file").textContent.trim(),
    uploadIcon: !!doc.querySelector("#upload-file svg"),
    summary: !!doc.querySelector("#file-summary"),
    list: !!doc.querySelector("#file-list"),
    cardActions: [...doc.querySelectorAll("#results .pack-actions > button")].map((button) => button.textContent.trim()),
    packButtonPrimary: doc.querySelector("#results .pack-actions > button")?.classList.contains("btn-primary") ?? false,
    cards: [...doc.querySelectorAll("#results .job h3")].map((el) => el.textContent.trim()),
  };

  // the two corner links: the wiki page follows the language, the source does not
  const linkInfo = (id) => {
    const el = doc.querySelector(id);
    return {
      href: el?.getAttribute("href") ?? null,
      target: el?.getAttribute("target") ?? null,
      rel: el?.getAttribute("rel") ?? null,
      tooltip: el?.dataset.tooltip ?? null,
      label: el?.getAttribute("aria-label") ?? null,
      icon: !!el?.querySelector("svg"),
      text: el?.textContent.trim() ?? "",
    };
  };
  const links = { zh: { wiki: linkInfo("#wiki-link"), repo: linkInfo("#repo-link") } };

  // switching the language has to translate the cards that are already there
  const captions = () => [...doc.querySelectorAll("#results figcaption")].map((el) => el.textContent);
  const before = captions();
  // the language switch is a button: it names the language it goes to
  const language = doc.querySelector("#language");
  const languageBefore = language.textContent.trim();
  language.click();
  for (let tick = 0; tick < 200 && JSON.stringify(captions()) === JSON.stringify(before); tick += 1) {
    await sleep(25);
  }
  const english = captions();
  const englishFiles = doc.querySelectorAll("#results a[download]").length;
  links.en = { wiki: linkInfo("#wiki-link"), repo: linkInfo("#repo-link") };
  const languageInEnglish = language.textContent.trim();
  language.click();
  for (let tick = 0; tick < 200 && JSON.stringify(captions()) === JSON.stringify(english); tick += 1) {
    await sleep(25);
  }
  const chinese = captions();

  // The switches have to redraw the card. Wait for the card to stop changing
  // first: a run started by the previous step may still land.
  // the animation no longer lives in the result card: it is beside the drop area
  // the animation is a canvas now: every redraw bumps its render counter
  const previewSrc = () => doc.querySelector("#preview-gif")?.dataset.render ?? "";
  const settle = async () => {
    let last = "";
    let stable = 0;
    for (let tick = 0; tick < 400; tick += 1) {
      await sleep(25);
      const now = previewSrc();
      if (now === last && now !== "") stable += 1;
      else stable = 0;
      last = now;
      if (stable >= 4) return now;
    }
    return last;
  };
  const flip = async (selector) => {
    const box = doc.querySelector(selector);
    box.checked = !box.checked;
    box.dispatchEvent(new Event("change", { bubbles: true }));
    // the re-render is debounced, so a settled card right now is still the old one
    await sleep(300);
    return box.checked;
  };

  await settle();
  // the export card shows the animation only
  const framesBefore = previewSrc();
  const playerOn = await flip("#opt-player");
  await settle();
  const playerChanged = previewSrc() !== framesBefore;
  if (playerOn) await flip("#opt-player");
  await settle();

  const femaleBefore = previewSrc();
  await flip("#opt-female");
  await settle();
  const femaleChanged = previewSrc() !== femaleBefore;
  await flip("#opt-female");
  await settle();
  const previewVisible = !doc.querySelector("#preview-gif").hidden;

  // the transport: it plays by default, steps one frame at a time, and the
  // counter shows the position in the GIF's own frame order
  const canvas = doc.querySelector("#preview-gif");
  const count = () => doc.querySelector("#gif-count").textContent.trim();
  const at = () => Number(count().split("/")[0]);
  const total = () => Number(count().split("/")[1]);
  const playing = () => doc.querySelector("#gif-play").getAttribute("aria-pressed") === "true";
  const playingAtStart = playing();
  const started = at();
  await sleep(400);
  const advanced = at() !== started;
  doc.querySelector("#gif-play").click();
  const pausedNow = !playing();
  const pausedAt = at();
  await sleep(350);
  const stayedPut = at() === pausedAt;
  const frames = total();
  doc.querySelector("#gif-next").click();
  const nextDelta = (at() - pausedAt + frames) % frames;
  doc.querySelector("#gif-prev").click();
  const prevDelta = (at() - pausedAt + frames) % frames;
  // the PNG link under the player, and its info icon
  const fileLink = () => doc.querySelector("#export-preview-file");
  const fileInfo = () => doc.querySelector("#export-preview-info");
  for (let tick = 0; tick < 400 && fileLink().hidden; tick += 1) await sleep(25);
  const playerFile = {
    text: fileLink().textContent,
    download: fileLink().getAttribute("download"),
    href: (fileLink().getAttribute("href") || "").slice(0, 5),
    hidden: fileLink().hidden,
    tooltip: fileInfo().dataset.tooltip,
    // the icon sits right beside the link, inside the player
    gap: Math.round(
      fileInfo().getBoundingClientRect().left -
        (fileLink().getBoundingClientRect().left + fileLink().getBoundingClientRect().width),
    ),
  };
  const transport = {
    playingAtStart,
    advanced,
    pausedNow,
    stayedPut,
    nextDelta,
    prevDelta,
    total: frames,
    canvasSize: [canvas.width, canvas.height],
    sizeValue: doc.querySelector("#export-gif-size").value,
    selectWidths: ["#export-gif-speed", "#export-gif-size"].map((sel) =>
      Math.round(doc.querySelector(sel).getBoundingClientRect().width),
    ),
  };
  doc.querySelector("#gif-play").click();

  // hand the original template back for the steps that follow
  await putFiles(doc, "#file-input", [["MyArmor.png", sheets.template]]);
  await waitRender(doc);
  await settle();

  // read the result card before the next step, which clears it on purpose
  const report = {
    heightsBefore,
    heightsAfter,
    buttons,
    ui,
    captions: { before, english, englishFiles, chinese },
    links,
    files: [...doc.querySelectorAll("#results a[download]")].map((a) => a.textContent),
    previews: doc.querySelectorAll("#preview-gif").length,
    sizes: doc.querySelector("#results .sheet-table tbody tr:not(.id-row) td:nth-child(2)")?.textContent.trim() ?? "",
    setId: doc.querySelector("#results .sheet-id")?.value ?? null,
    idNames: [...doc.querySelectorAll("#results .id-cell .id-name")].map((el) => el.textContent.trim()),
    playerChanged,
    femaleChanged,
    previewVisible,
    transport,
    playerFile,
    stored: JSON.parse(frame.contentWindow.localStorage.getItem("armorhelper.history") || "[]"),
    status: doc.querySelector("#status").textContent.trim(),
  };

  // editing a row's ID renames that tab's files with no click of its own
  const names = () => [...doc.querySelectorAll("#results a[download]")].map((a) => a.textContent);
  const idField = doc.querySelector("#results .sheet-id");
  report.idRename = { before: names() };
  if (idField) {
    const type = (value) => {
      idField.value = value;
      idField.dispatchEvent(new frame.contentWindow.Event("change", { bubbles: true }));
    };
    type("123");
    for (let tick = 0; tick < 200; tick += 1) {
      await sleep(25);
      if (names().some((name) => name.includes("123"))) break;
    }
    report.idRename.after = names();
    report.idRename.headNames = [...doc.querySelectorAll("#results .id-cell .id-name")].map((el) =>
      el.textContent.trim(),
    );
    // put the settings back for the steps that follow
    type("0");
    for (let tick = 0; tick < 200; tick += 1) {
      await sleep(25);
      if (names().every((name) => !name.includes("123"))) break;
    }
  }

  // a wrong size is refused: no result, and the status line says why
  await putFiles(doc, "#file-input", [["WrongSize.png", sheets.head]]);
  for (let tick = 0; tick < 200; tick += 1) {
    await sleep(25);
    if (doc.querySelector("#status").className !== "ok") break;
  }
  report.wrongSize = {
    hasResult: !!doc.querySelector("#results .pack"),
    titles: cardTitles(doc),
    status: doc.querySelector("#status").textContent.trim(),
  };
  await sleep(150);

  // one template at a time: the second replaces the first, and the first one's
  // result goes with it
  await putFiles(doc, "#file-input", [["Second.png", sheets.template]]);
  await waitRender(doc);
  report.replaced = {
    titles: cardTitles(doc),
    resultsText: doc.querySelector("#results").textContent.trim(),
  };

  // hand the original template back: later steps export by that name
  await putFiles(doc, "#file-input", [["MyArmor.png", sheets.template]]);
  await waitRender(doc);
  return report;
}

/** Press one button and return the blob it handed to `URL.createObjectURL`. */
async function captureDownload(win, button) {
  const captured = [];
  const realCreate = win.URL.createObjectURL.bind(win.URL);
  win.URL.createObjectURL = (blob) => {
    captured.push(blob);
    return realCreate(blob);
  };
  button.click();
  for (let tick = 0; tick < 400 && !captured.length; tick += 1) await sleep(25);
  win.URL.createObjectURL = realCreate;
  if (!captured.length) return { error: "no download" };
  const buffer = new Uint8Array(await captured[0].arrayBuffer());
  let binary = "";
  for (const byte of buffer) binary += String.fromCharCode(byte);
  return {
    bytes: buffer.length,
    signature: String.fromCharCode(...buffer.slice(0, 2)),
    base64: btoa(binary),
  };
}

/**
 * The material pack cards: a file table, the sheets, and their own pack button.
 *
 * Both eras get a card. Only the 1.4.4 one writes a resource pack, because 1.3
 * has no `pack.json`.
 */
async function runPackCards(doc) {
  for (let tick = 0; tick < 400; tick += 1) {
    await sleep(25);
    if (doc.querySelectorAll("#results .pack-tabs .nav-link").length > 1) break;
  }
  await sleep(150);

  // the card is rebuilt on every tab click, so never keep a reference to it
  const card = () => doc.querySelector("#results .pack");
  const tabs = () => [...card().querySelectorAll(".pack-tabs .nav-link")];
  const activeTab = () => card().querySelector(".pack-tabs .nav-link.active")?.textContent.trim() ?? null;
  const pick = async (label) => {
    tabs().find((el) => el.textContent.trim() === label)?.click();
    for (let tick = 0; tick < 400; tick += 1) {
      await sleep(25);
      if (activeTab() === label) break;
    }
    await sleep(150);
  };
  const readTab = () => ({
    button: card().querySelector(".pack-actions > button")?.textContent.trim() ?? null,
    inputs: [...card().querySelectorAll(".pack-info input")].map((input) => input.placeholder),
    rows: [...card().querySelectorAll(".sheet-table tbody tr")].map((tr) =>
      [...tr.children].map((td) => td.textContent.trim()),
    ),
    headers: [...card().querySelectorAll(".sheet-table thead th")].map((th) =>
      th.textContent.trim(),
    ),
    // the ID column carries an input plus the vanilla name it resolves to
    ids: [...card().querySelectorAll(".id-cell")].map((cell) => ({
      value: cell.querySelector("input").value,
      name: cell.querySelector(".id-name").textContent.trim(),
    })),
    columns: [...card().querySelectorAll(".sheet-col figcaption")].map((el) => el.textContent.trim()),
    sheets: card().querySelectorAll(".sheet-col img").length,
    tabs: tabs().map((el) => el.textContent.trim()),
    activeTab: activeTab(),
  });

  // the tab is remembered across runs, so pick 1.4.4+ explicitly
  await pick("1.4");
  const first = readTab();
  const pack144 = await captureDownload(frame.contentWindow, card().querySelector(".pack-actions > button"));

  await pick("1.3");
  const second = readTab();
  // 1.3 has no pack button any more: its table is all it offers
  const pack13 = { error: "no button" };

  await pick("1.4");
  // the full armour tab is gone: the player covers it
  return { info: [first, second], packs: [pack144, pack13] };
}

/** Fire "rebuild every set" and let it finish, watching the progress messages. */
async function runReverseAll(doc) {
  doc.querySelector("#do-reverse-all").click();

  let sawFill = false;

    };
}

/**
 * The harness clicks the real "download" buttons.  Anchor clicks are therefore
 * swallowed: the tests capture the blob through `URL.createObjectURL`, and the
 * user's Downloads folder stays empty.
 */
/**
 * Remember anything the page throws.  A leftover identifier (`!!images` in
 * renderFolders) only fired on one path and vanished into the status bar
 * without failing any assertion.
 */
function collectErrors(win) {
  if (win.__errors) return;
  win.__errors = [];
  win.addEventListener("error", (event) => win.__errors.push(String(event.message)));
  win.addEventListener("unhandledrejection", (event) => {
    const reason = event.reason;
    win.__errors.push(String((reason && reason.message) || reason));
  });
}

function blockDownloads(win) {
  if (win.__downloadsBlocked) return;
  win.__downloadsBlocked = true;
  const proto = win.HTMLAnchorElement.prototype;
  const real = proto.click;
  proto.click = function click() {
    if (this.hasAttribute && this.hasAttribute("download")) return undefined;
    return real.call(this);
  };
}

let ticks = 0;
let lastStatus = "";
let settled = 0;
const timer = setInterval(async () => {
  ticks += 1;
  let doc;
  try {
    doc = frame.contentDocument;
    if (frame.contentWindow) {
      blockDownloads(frame.contentWindow);
      collectErrors(frame.contentWindow);
    }
    const status = doc.querySelector("#status");
    const text = status ? status.textContent.trim() : "";
    // the page reverses a set while it boots, so wait for the bar to settle
    if (text && text === lastStatus && status.className !== "busy") settled += 1;
    else settled = 0;
    lastStatus = text;
    if (settled < 5) {
      if (ticks > 2000) {
        clearInterval(timer);
        report({ error: "timeout waiting for the app" });
      }
      return;
    }
    if (!text || text === "…") {
      if (ticks > 2000) {
        clearInterval(timer);
        report({ error: "timeout waiting for the app" });
      }
      return;
    }
    clearInterval(timer);
  } catch (error) {
    clearInterval(timer);
    report({ error: String(error) });
    return;
  }

  try {
    const app = appInfo(doc);
    const serviceWorker = await serviceWorkerInfo(frame.contentWindow);
    // 1. no folder, no uploads — this is the phone case: the textures shipped
    //    with the site have to be found on their own.
    step("reverse");
    const builtin = await runReverse(doc);
    step("reverse-fallback");
    const fallback = await runReverseFallback(doc);
    step("reverse-pick");
    const pick = await runReversePick(doc);
    step("drop-tools");
    const dropTools = await runDropTools(doc);
    // 2. an export from a dropped template, which also fills the history
    step("export");
    const exported = await runExport(doc);
    step("pack-cards");
    const packCards = await runPackCards(doc);
    // 3. the same thing again, but with the user's own files uploaded
    step("upload");
    await uploadTextures(doc);
    const uploaded = await runReverse(doc);
    // 4. the preview-sheets tab, with three separate slots
    step("sheet-gifs");
    const gifs = await runSheetGifs(doc);
    step("resource-pack");
    const pack = await runResourcePack(doc);
    step("player-overlay");
    const player = await runPlayerOverlay(doc);
    // 5. the long task: cancel works, and a full run reports progress
    step("reverse-all-cancel");
    const cancelled = await runReverseAllCancel(doc);
    step("reverse-all");
    const reverseAll = await runReverseAll(doc);
    report({
      ...app,
      serviceWorker,
      builtin,
      fallback,
      pick,
      dropTools,
      exported,
      packCards,
      uploaded,
      gifs,
      pack,
      player,
      cancelled,
      reverseAll,
      errors: frame.contentWindow.__errors ?? [],
    });
  } catch (error) {
    report({ error: String((error && error.stack) || error) });
  }
}, 20);
</script>
