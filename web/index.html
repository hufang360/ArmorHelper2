<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161c">
<title>ArmorHelper · Web</title>
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="data/icon.png">
<link rel="apple-touch-icon" href="data/icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body class="d-flex flex-column min-vh-100">

<header class="topbar border-bottom">
  <div class="container-xxl d-flex align-items-center flex-wrap gap-2 py-2 px-3">

    <div class="brand d-flex align-items-center gap-2">
      <img src="data/icon.png" alt="" width="40" height="40" class="brand-icon">
      <div>
        <h1 class="h5 mb-0">ArmorHelper <span class="app-version" id="app-version"></span></h1>
        <p class="text-body-secondary small mb-0" data-i18n="web.subtitle"></p>
      </div>
    </div>

    <nav class="tabs nav nav-underline flex-nowrap ms-auto">
      <button class="tab nav-link active" data-tab="export" data-i18n="web.tab.export"></button>
      <button class="tab nav-link" data-tab="gifs" data-i18n="web.tab.gifs"></button>
      <button class="tab nav-link" data-tab="reverse" data-i18n="web.tab.reverse"></button>
      <button class="tab nav-link" data-tab="settings" data-i18n="web.tab.settings"></button>
    </nav>

    <div class="lang">
      <!-- the label names the language it switches to: "En" in Chinese, "中" in English -->
      <button class="btn btn-sm lang-toggle" type="button" id="language"
              data-i18n-label="web.languageHint">En</button>
    </div>

    <!-- the source: the site is nothing but these static files.
         Icon: the GitHub mark, from GitHub's Octicons (MIT). -->
    <a class="icon-btn repo-link" id="repo-link"
       href="https://github.com/hufang360/ArmorHelper2" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>

  </div>
</header>

<main class="container-xxl flex-grow-1 px-3 py-3">
  <div class="tab-content">

    <!-- ============================= 导出 ============================= -->
    <section class="panel tab-pane active" id="tab-export">
      <div class="stack export-stack">

        <div class="card export-card">
          <div class="card-body">
            <h2 class="card-title h6 text-uppercase text-body-secondary" data-i18n="web.exportTitle"></h2>

            <!-- two columns: the template on the left, its sheets on the right -->
            <div class="export-split">
              <div class="export-left">
                <div id="drop" class="drop" tabindex="0" role="button">
                  <span class="drop-tools">
                    <button class="icon-btn" type="button" id="drop-clear" disabled>
                      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                        <path d="M4.5 4.5l7 7m0-7l-7 7"
                              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                      </svg>
                    </button>
                    <button class="icon-btn" type="button" id="drop-guide" aria-pressed="false">
                      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                        <rect x="2.5" y="2.5" width="11" height="11" rx="1"
                              fill="none" stroke="currentColor" stroke-width="1.3"/>
                        <path d="M2.5 8h11M8 2.5v11" fill="none" stroke="currentColor"
                              stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 2"/>
                      </svg>
                    </button>
                    <button class="icon-btn" type="button" id="drop-download">
                      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                        <path d="M8 2v7m0 0 3-3m-3 3L5 6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                        <path d="M2.5 11.5v2h11v-2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                      </svg>
                    </button>
                  </span>
                  <img id="template-preview" class="drop-preview pixel" alt="" hidden>
                  <p id="drop-hint" class="mb-0" data-i18n="web.drop"></p>
                  <input type="file" id="file-input" accept=".png,.webp,image/png,image/webp" hidden>
                </div>
                <div class="actions">
                  <button class="btn btn-sm btn-primary" id="upload-file" data-i18n="web.upload"></button>
                  <button class="btn btn-sm btn-secondary" id="load-demo" data-i18n="web.demo"></button>
                  <!-- 1.3 has no resource pack: the button stays disabled there -->
                  <button class="btn btn-sm btn-primary" id="export-pack" data-i18n="web.packMake" disabled></button>
                </div>

                <!-- pack.json fields, shown only for a 1.4 result -->
                <div class="pack-info input-group input-group-sm" id="export-pack-info" hidden>
                  <input type="text" class="form-control is-short" id="export-pack-name"
                         data-i18n-placeholder="web.packName" data-i18n-label="web.packName">
                  <input type="text" class="form-control is-short" id="export-pack-author"
                         data-i18n-placeholder="web.packAuthor" data-i18n-label="web.packAuthor">
                  <input type="text" class="form-control is-long" id="export-pack-desc"
                         data-i18n-placeholder="web.packDescription" data-i18n-label="web.packDescription">
                </div>
              </div>

              <div class="export-right">
                <div class="preview-box gif-player" hidden>
                  <div class="gif-player-stage">
                    <canvas id="preview-gif" class="pixel" width="40" height="56" hidden></canvas>
                  </div>
                  <div class="gif-player-opts">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="opt-female">
                      <label class="form-check-label" for="opt-female" data-i18n="web.female"></label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="opt-player">
                      <label class="form-check-label" for="opt-player" data-i18n="web.player"></label>
                      <span class="info-icon" id="player-info" tabindex="0" role="img">
                        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                          <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
                          <path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                          <circle cx="8" cy="5" r=".8" fill="currentColor"/>
                        </svg>
                      </span>
                    </div>
                    <select id="export-gif-speed" class="form-select form-select-sm" data-i18n-label="web.gifSpeed">
                      <option value="fast" data-i18n="web.gifSpeedFast"></option>
                      <option value="medium" data-i18n="web.gifSpeedMedium"></option>
                      <option value="slow" data-i18n="web.gifSpeedSlow"></option>
                    </select>
                    <select id="export-gif-size" class="form-select form-select-sm" data-i18n-label="web.gifSize">
                      <option value="1" data-i18n="web.gifSizeNative"></option>
                      <option value="2" data-i18n="web.gifSizeDouble"></option>
                      <option value="4" data-i18n="web.gifSizeQuad"></option>
                    </select>
                    <div class="preview-frames">
                      <button class="icon-btn" type="button" id="gif-play" aria-pressed="true">
                        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                          <path id="gif-play-icon" d="M5 3.5v9l7-4.5z" fill="currentColor"/>
                        </svg>
                      </button>
                      <button class="icon-btn" type="button" id="gif-prev">
                        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                          <path d="M4 3.5v9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                          <path d="M12 3.5v9L5.5 8z" fill="currentColor"/>
                        </svg>
                      </button>
                      <button class="icon-btn" type="button" id="gif-next">
                        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                          <path d="M12 3.5v9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                          <path d="M4 3.5v9l6.5-4.5z" fill="currentColor"/>
                        </svg>
                      </button>
                      <span class="preview-count" id="gif-count">0/0</span>
                    </div>
                    <hr class="preview-rule">
                    <!-- the PNG of what is shown; hover shows its pixels -->
                    <p class="gif-player-file-row">
                      <a class="gif-player-file" id="export-preview-file" href="#" download hidden></a>
                      <span class="info-icon gif-player-info" id="export-preview-info" tabindex="0" role="img">
                        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                          <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
                          <path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                          <circle cx="8" cy="5" r=".8" fill="currentColor"/>
                        </svg>
                      </span>
                    </p>
                  </div>
                </div>
                <div id="results" class="results export-results"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="card help-card">
          <div class="card-body">
            <h2 class="card-title h6 text-uppercase text-body-secondary" data-i18n="web.helpExportTitle"></h2>
            <p class="mb-0 small help-text" data-i18n="web.helpExport"></p>
          </div>
        </div>

      </div>
    </section>

    <!-- ============================ 预览贴图 ============================ -->
    <section class="panel tab-pane" id="tab-gifs">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title h6 text-uppercase text-body-secondary" data-i18n="web.gifsTitle"></h2>

          <div class="gifs-split">
            <div class="gifs-input">
              <div class="slots">
                <div class="slot" data-role="head">
                  <div class="slot-drop thin-scroll" id="sheet-head-slot" tabindex="0" role="button">
                    <button class="icon-btn slot-clear" type="button" id="sheet-head-clear" hidden>
                      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                        <path d="M4.5 4.5l7 7m0-7l-7 7"
                              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                      </svg>
                    </button>
                    <button class="icon-btn slot-swap" type="button" id="sheet-head-swap" hidden>
                      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                        <path d="M3.5 5.5h9m0 0-2-2m2 2-2 2" fill="none" stroke="currentColor"
                              stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12.5 10.5h-9m0 0 2-2m-2 2 2 2" fill="none" stroke="currentColor"
                              stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                    <img id="sheet-head-thumb" class="slot-thumb pixel" alt="" hidden>
                    <span id="sheet-head-hint" class="small" data-i18n="web.slot.headDrop"></span>
                    <input type="file" id="sheet-head-input" accept=".png,.bmp,image/png,image/bmp" hidden>
                  </div>
                  <span class="slot-foot">
                    <span class="slot-label" data-i18n="web.slot.headTitle"></span>
                    <span class="info-icon" id="sheet-head-info" role="img" tabindex="0" hidden>
                      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                        <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                        <circle cx="8" cy="5" r=".8" fill="currentColor"/>
                      </svg>
                    </span>
                  </span>
                </div>
                <div class="slot" data-role="body">
                  <div class="slot-drop" id="sheet-body-slot" tabindex="0" role="button">
                    <button class="icon-btn slot-clear" type="button" id="sheet-body-clear" hidden>
                      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                        <path d="M4.5 4.5l7 7m0-7l-7 7"
                              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                      </svg>
                    </button>
                    <img id="sheet-body-thumb" class="slot-thumb pixel" alt="" hidden>
                    <span id="sheet-body-hint" class="small" data-i18n="web.slot.bodyDrop"></span>
                    <input type="file" id="sheet-body-input" accept=".png,.bmp,image/png,image/bmp" hidden>
                  </div>
                  <span class="slot-foot">
                    <span class="slot-label" data-i18n="web.slot.bodyTitle"></span>
                    <span class="info-icon" id="sheet-body-info" role="img" tabindex="0" hidden>
                      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                        <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                        <circle cx="8" cy="5" r=".8" fill="currentColor"/>
                      </svg>
                    </span>
                  </span>
                </div>
                <div class="slot" data-role="legs">
                  <div class="slot-drop thin-scroll" id="sheet-legs-slot" tabindex="0" role="button">
                    <button class="icon-btn slot-clear" type="button" id="sheet-legs-clear" hidden>
                      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                        <path d="M4.5 4.5l7 7m0-7l-7 7"
                              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                      </svg>
                    </button>
                    <button class="icon-btn slot-swap" type="button" id="sheet-legs-swap" hidden>
                      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                        <path d="M3.5 5.5h9m0 0-2-2m2 2-2 2" fill="none" stroke="currentColor"
                              stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12.5 10.5h-9m0 0 2-2m-2 2 2 2" fill="none" stroke="currentColor"
                              stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                    <img id="sheet-legs-thumb" class="slot-thumb pixel" alt="" hidden>
                    <span id="sheet-legs-hint" class="small" data-i18n="web.slot.legsDrop"></span>
                    <input type="file" id="sheet-legs-input" accept=".png,.bmp,image/png,image/bmp" hidden>
                  </div>
                  <span class="slot-foot">
                    <span class="slot-label" data-i18n="web.slot.legsTitle"></span>
                    <span class="info-icon" id="sheet-legs-info" role="img" tabindex="0" hidden>
                      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                        <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                        <circle cx="8" cy="5" r=".8" fill="currentColor"/>
                      </svg>
                    </span>
                  </span>
                </div>
              </div>

              <p class="text-body-secondary small mb-0" id="sheet-status"></p>


              <div class="actions">
                <button class="btn btn-sm btn-primary" id="upload-sheets" data-i18n="web.upload"></button>
                <button class="btn btn-sm btn-secondary" id="load-sheets-demo" data-i18n="web.demo"></button>
                <!-- only offered once the three sheets are in: it makes the pack -->
                <button class="btn btn-sm btn-primary" id="do-pack" data-i18n="web.packMake" disabled hidden></button>
                <input type="file" id="sheet-bulk-input" accept=".png,.bmp,image/png,image/bmp" multiple hidden>
              </div>

              <!-- pack.json fields of the resource pack; the export page edits the same three -->
              <div class="pack-info input-group input-group-sm" id="sheet-pack-info" hidden>
                <input type="text" class="form-control is-short" id="sheet-pack-name"
                       data-i18n-placeholder="web.packName" data-i18n-label="web.packName">
                <input type="text" class="form-control is-short" id="sheet-pack-author"
                       data-i18n-placeholder="web.packAuthor" data-i18n-label="web.packAuthor">
                <input type="text" class="form-control is-long" id="sheet-pack-desc"
                       data-i18n-placeholder="web.packDescription" data-i18n-label="web.packDescription">
              </div>

            </div>

            <div class="gifs-output">
              <!-- the export page's 20 frame player, laid out in two columns: the
                 picture on the left, one control per row on the right, and the
                 transport under the selects -->
              <div class="preview-box gif-player" id="sheet-preview-box" hidden>
                <div class="gif-player-stage">
                  <canvas id="sheet-preview-gif" class="pixel" width="40" height="56" hidden></canvas>
                </div>
                <div class="gif-player-opts">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="sheet-opt-female">
                    <label class="form-check-label" for="sheet-opt-female" data-i18n="web.female"></label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="sheet-opt-player">
                    <label class="form-check-label" for="sheet-opt-player" data-i18n="web.player"></label>
                    <span class="info-icon" id="sheet-player-info" tabindex="0" role="img">
                      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                        <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                        <circle cx="8" cy="5" r=".8" fill="currentColor"/>
                      </svg>
                    </span>
                  </div>
                  <select id="sheet-preview-speed" class="form-select form-select-sm" data-i18n-label="web.gifSpeed">
                    <option value="fast" data-i18n="web.gifSpeedFast"></option>
                    <option value="medium" data-i18n="web.gifSpeedMedium"></option>
                    <option value="slow" data-i18n="web.gifSpeedSlow"></option>
                  </select>
                  <select id="sheet-preview-size" class="form-select form-select-sm" data-i18n-label="web.gifSize">
                    <option value="1" data-i18n="web.gifSizeNative"></option>
                    <option value="2" data-i18n="web.gifSizeDouble"></option>
                    <option value="4" data-i18n="web.gifSizeQuad"></option>
                  </select>
                  <div class="preview-frames">
                    <button class="icon-btn" type="button" id="sheet-gif-play" aria-pressed="true">
                      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                        <path id="sheet-gif-play-icon" d="M5 3.5v9l7-4.5z" fill="currentColor"/>
                      </svg>
                    </button>
                    <button class="icon-btn" type="button" id="sheet-gif-prev">
                      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                        <path d="M4 3.5v9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                        <path d="M12 3.5v9L5.5 8z" fill="currentColor"/>
                      </svg>
                    </button>
                    <button class="icon-btn" type="button" id="sheet-gif-next">
                      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                        <path d="M12 3.5v9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                        <path d="M4 3.5v9l6.5-4.5z" fill="currentColor"/>
                      </svg>
                    </button>
                    <span class="preview-count" id="sheet-gif-count">0/0</span>
                  </div>
                  <hr class="preview-rule">
                  <!-- the PNG the two switches above name; hover shows its pixels -->
                  <p class="gif-player-file-row">
                    <a class="gif-player-file" id="sheet-preview-file" href="#" download hidden></a>
                    <span class="info-icon gif-player-info" id="sheet-preview-info" tabindex="0" role="img">
                      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                        <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                        <circle cx="8" cy="5" r=".8" fill="currentColor"/>
                      </svg>
                    </span>
                  </p>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>

      <div class="card help-card">
        <div class="card-body">
          <h2 class="card-title h6 text-uppercase text-body-secondary" data-i18n="web.helpSheetsTitle"></h2>
          <p class="mb-0 small help-text" data-i18n="web.helpSheets"></p>
        </div>
      </div>
    </section>

    <!-- =========================== 反向还原 =========================== -->
    <section class="panel tab-pane" id="tab-reverse">
      <div class="row g-2 rev-row">

        <div class="col-12 col-lg-6">
          <div class="card rev-card">
            <div class="card-body">
              <h2 class="card-title h6 text-uppercase text-body-secondary" data-i18n="web.reverseTitle"></h2>

              <div class="field">
                <label class="form-label small text-body-secondary mb-1" for="set-search" data-i18n="web.reverseSearch"></label>
                <input type="search" id="set-search" class="form-control form-control-sm" data-i18n-placeholder="web.reverseSearch">
              </div>

              <div class="field">
                <label class="form-label small text-body-secondary mb-1" for="set-select" data-i18n="web.reverseSet"></label>
                <select id="set-select" class="form-select form-select-sm" size="8"></select>
              </div>

              <div class="row g-2">
              <div class="col-4">
              <input type="number" class="form-control form-control-sm" id="rev-head" min="0" max="999"
              data-i18n-placeholder="web.slot.head">
              <span class="d-block small text-body-secondary mt-1" id="rev-head-name"></span>
              </div>
              <div class="col-4">
              <input type="number" class="form-control form-control-sm" id="rev-body" min="0" max="999"
              data-i18n-placeholder="web.slot.body">
              <span class="d-block small text-body-secondary mt-1" id="rev-body-name"></span>
              </div>
              <div class="col-4">
              <input type="number" class="form-control form-control-sm" id="rev-legs" min="0" max="999"
              data-i18n-placeholder="web.slot.legs">
              <span class="d-block small text-body-secondary mt-1" id="rev-legs-name"></span>
              </div>
              </div>
              <p class="text-body-secondary small mb-2" data-i18n="web.idsHint"></p>

              <hr class="my-2">

              <div class="field">
                <span class="form-label d-block small text-body-secondary mb-1" data-i18n="web.textureSource"></span>
                <div class="inputrow d-flex flex-wrap gap-1">
                  <button class="btn btn-sm btn-secondary" id="pick-images" data-i18n="web.pickImages"></button>
                  <input type="file" id="texture-input" accept=".png" multiple hidden>
                  <button class="btn btn-sm btn-secondary" id="pick-textures" data-i18n="web.pickFiles"></button>
                </div>
              </div>
              <p class="text-body-secondary small mb-1" id="images-status"></p>
              <!-- the wiki lists every armor ID, in the reader's language -->
              <a class="wiki-link" id="wiki-link"
                 href="https://terraria.wiki.gg/zh/wiki/Armor_IDs" target="_blank" rel="noopener"
                 data-i18n="web.wikiHint"></a>

              <div class="rev-settings">
                <div class="form-check mb-0">
                  <input class="form-check-input" type="checkbox" id="rev-guide">
                  <label class="form-check-label" for="rev-guide" data-i18n="web.guideOverlay"></label>
                </div>
              </div>

              <div class="actions">
                <button class="btn btn-sm btn-secondary" id="do-reverse-all" data-i18n="web.reverseAll"></button>
                <!-- the result's download buttons, filled in when there is a result -->
                <span class="actions-slot" id="reverse-actions"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="card results-card rev-card">
            <div class="card-body">
              <h2 class="card-title h6 text-uppercase text-body-secondary" data-i18n="web.previewSheet"></h2>

              <p class="rev-set-name" id="rev-set-name"></p>
              <hr class="preview-rule">
              <div id="reverse-result" class="results"><p class="text-body-secondary mb-0" data-i18n="web.empty"></p></div>

              <div class="preview-box gif-player" id="rev-preview-box" hidden>
              <div class="gif-player-stage">
              <canvas id="rev-preview-gif" class="pixel" width="40" height="56" hidden></canvas>
              </div>
              <div class="gif-player-opts">
              <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rev-opt-female">
              <label class="form-check-label" for="rev-opt-female" data-i18n="web.female"></label>
              </div>
              <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rev-opt-player">
              <label class="form-check-label" for="rev-opt-player" data-i18n="web.player"></label>
              <span class="info-icon" id="rev-player-info" tabindex="0" role="img">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
              <path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="8" cy="5" r=".8" fill="currentColor"/>
              </svg>
              </span>
              </div>
              <select id="rev-gif-speed" class="form-select form-select-sm" data-i18n-label="web.gifSpeed">
              <option value="fast" data-i18n="web.gifSpeedFast"></option>
              <option value="medium" data-i18n="web.gifSpeedMedium"></option>
              <option value="slow" data-i18n="web.gifSpeedSlow"></option>
              </select>
              <select id="rev-gif-size" class="form-select form-select-sm" data-i18n-label="web.gifSize">
              <option value="1" data-i18n="web.gifSizeNative"></option>
              <option value="2" data-i18n="web.gifSizeDouble"></option>
              <option value="4" data-i18n="web.gifSizeQuad"></option>
              </select>
              <div class="preview-frames">
              <button class="icon-btn" type="button" id="rev-gif-play" aria-pressed="true">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path id="rev-gif-play-icon" d="M5 3.5v9l7-4.5z" fill="currentColor"/>
              </svg>
              </button>
              <button class="icon-btn" type="button" id="rev-gif-prev">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M4 3.5v9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M12 3.5v9L5.5 8z" fill="currentColor"/>
              </svg>
              </button>
              <button class="icon-btn" type="button" id="rev-gif-next">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M12 3.5v9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M4 3.5v9l6.5-4.5z" fill="currentColor"/>
              </svg>
              </button>
              <span class="preview-count" id="rev-gif-count">0/0</span>
              </div>
              <hr class="preview-rule">
              <!-- the PNG of what is shown; hover shows its pixels -->
              <p class="gif-player-file-row">
              <a class="gif-player-file" id="rev-preview-file" href="#" download hidden></a>
              <span class="info-icon gif-player-info" id="rev-preview-info" tabindex="0" role="img">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
              <path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="8" cy="5" r=".8" fill="currentColor"/>
              </svg>
              </span>
              </p>
              </div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <div class="card help-card">
        <div class="card-body">
          <h2 class="card-title h6 text-uppercase text-body-secondary" data-i18n="web.helpReverseTitle"></h2>
          <p class="mb-0 small help-text" data-i18n="web.helpReverse"></p>
        </div>
      </div>
    </section>
    <!-- ============================= 设置 ============================= -->
    <section class="panel tab-pane" id="tab-settings">
      <div class="row g-2">
        <div class="col-12 col-lg-8">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title h6 text-uppercase text-body-secondary" data-i18n="web.settingsTitle"></h2>

              <div class="field">
                <span class="form-label d-block small text-body-secondary mb-1" data-i18n="web.outputFolder"></span>
                <div class="inputrow d-flex flex-wrap gap-1">
                  <button class="btn btn-sm btn-secondary" id="pick-output" data-i18n="web.pickOutput"></button>
                  <button class="btn btn-sm btn-secondary" id="clear-output" data-i18n="web.clearOutput"></button>
                </div>
              </div>
              <p class="text-body-secondary small mb-1" id="output-status"></p>

              <div class="field">
                <span class="form-label d-block small text-body-secondary mb-1" data-i18n="details.images"></span>
                <div class="inputrow d-flex flex-wrap gap-1">
                  <button class="btn btn-sm btn-secondary" id="pick-images-2" data-i18n="web.pickImages"></button>
                  <button class="btn btn-sm btn-secondary" id="clear-images" data-i18n="web.clearOutput"></button>
                </div>
              </div>
              <p class="text-body-secondary small mb-1" id="images-status-2"></p>

              <div class="row g-2">
                <div class="col-6 col-sm-3">
                  <label class="form-label small text-body-secondary mb-1" for="set-head" data-i18n="details.idHead"></label>
                  <input type="number" class="form-control form-control-sm" id="set-head" min="0" max="999">
                </div>
                <div class="col-6 col-sm-3">
                  <label class="form-label small text-body-secondary mb-1" for="set-body" data-i18n="details.idBody"></label>
                  <input type="number" class="form-control form-control-sm" id="set-body" min="0" max="999">
                </div>
                <div class="col-6 col-sm-3">
                  <label class="form-label small text-body-secondary mb-1" for="set-legs" data-i18n="details.idLegs"></label>
                  <input type="number" class="form-control form-control-sm" id="set-legs" min="0" max="999">
                </div>
                <div class="col-6 col-sm-3">
                  <label class="form-label small text-body-secondary mb-1" for="set-skin" data-i18n="details.skin"></label>
                  <input type="number" class="form-control form-control-sm" id="set-skin" min="0" max="9">
                </div>
              </div>

              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="set-glow">
                <label class="form-check-label" for="set-glow" data-i18n="details.glow"></label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="set-verify">
                <label class="form-check-label" for="set-verify" data-i18n="web.verify"></label>
              </div>

              <div class="actions">
                <button class="btn btn-sm btn-primary" id="save-settings" data-i18n="web.saveSettings"></button>
              </div>
              <p class="text-body-secondary small mb-0" id="about"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

  </div>
</main>

<footer class="statusbar border-top">
  <div class="container-xxl d-flex align-items-center gap-2 px-3 py-1">
    <span id="status" class="ok">…</span>
    <div id="job-bar" class="progress" role="progressbar" data-i18n-label="web.progress" aria-valuemin="0" aria-valuemax="100" hidden>
      <div class="progress-bar" style="width: 0%"></div>
    </div>
    <button class="btn btn-sm btn-secondary" id="cancel-job" data-i18n="web.cancelJob" hidden></button>
  </div>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
