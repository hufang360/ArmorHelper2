<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#14161c}iframe{border:0;width:1240px;height:1050px}</style>
<iframe id="f" src="/"></iframe>
<script type="module">
const f = document.getElementById("f");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const wait = async (fn, n = 600) => { for (let i = 0; i < n; i += 1) { const v = fn(); if (v) return v; await sleep(25); } return null; };
const mode = new URLSearchParams(location.search).get("mode");
const timer = setInterval(async () => {
  const doc = f.contentDocument;
  const status = doc.querySelector("#status");
  if (!status || status.textContent.trim() === "…" || !doc.querySelector(".tab")) return;
  clearInterval(timer);
  const { loadLayout } = await import("/js/data.js");
  const { decodeBitmap } = await import("/js/fs.js");
  const { generateHead, generateLegs, generateBodyComposite } = await import("/js/generate.js");
  const { pngBlob } = await import("/js/png.js");
  await loadLayout("/data/layout.json");
  const template = await decodeBitmap(await (await fetch("/data/ArmorTemplate_v1.png")).blob());
  const sheets = {
    head: ["Armor_Head_189.png", generateHead(template)],
    body: ["Armor_190.png", generateBodyComposite(template)],
    legs: ["Armor_Legs_130.png", generateLegs(template)],
  };
  if (mode === "export") {
    const transfer = new DataTransfer();
    transfer.items.add(new File([await pngBlob(template)], "铜盔甲.png", { type: "image/png" }));
    const input = doc.querySelector("#file-input");
    input.files = transfer.files;
    input.dispatchEvent(new Event("change", { bubbles: true }));
    await wait(() => doc.querySelectorAll("#file-list li").length);
    doc.querySelector("#do-export").click();
    await wait(() => doc.querySelectorAll("#results .files a").length);
    await sleep(900);
    return;
  }
  doc.querySelector('.tab[data-tab="gifs"]').click();
  for (const role of ["head", "body", "legs"]) {
    const [name, bitmap] = sheets[role];
    const transfer = new DataTransfer();
    transfer.items.add(new File([await pngBlob(bitmap)], name, { type: "image/png" }));
    const input = doc.querySelector(`#sheet-${role}-input`);
    input.files = transfer.files;
    input.dispatchEvent(new Event("change", { bubbles: true }));
  }
  await wait(() => !doc.querySelector("#do-gifs").disabled);
  doc.querySelector("#gif-size").value = "2";
  doc.querySelector("#gif-size").dispatchEvent(new Event("change", { bubbles: true }));
  doc.querySelector("#do-gifs").click();
  await wait(() => doc.querySelectorAll("#gif-results .preview img").length);
  await sleep(1200);
}, 30);
</script>
