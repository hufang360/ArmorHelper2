name: Deploy the web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the wasm WebP codec (only the atlas packer needs it)
        run: npm ci

      # The web app is the only implementation: web/data is the source of truth,
      # and its pixels are pinned by the frozen images in web/tests/golden.
      - name: Check the core, the browser, the bundle and the docs
        run: npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
